<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Diwali from Golu Singh 🪔</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #03030c;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            user-select: none;
            touch-action: manipulation;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 2;
            pointer-events: none;
            width: 90%;
            max-width: 500px;
        }
        .diya {
            font-size: 55px;
            animation: pulse 1.5s infinite alternate;
            filter: drop-shadow(0 0 20px gold);
        }
        h1 {
            font-size: 2.4rem;
            color: #ffd700;
            text-shadow: 0 0 10px #ff9900, 0 0 25px #ff5500, 0 0 40px #ff2200;
            margin: 10px 0;
            letter-spacing: 1.5px;
        }
        h2 {
            font-size: 1.5rem;
            color: #fff;
            text-shadow: 0 0 8px #00e5ff, 0 0 18px #0077ff;
            font-weight: 600;
        }
        .name {
            color: #ff3366;
            text-shadow: 0 0 12px #ff0055, 0 0 25px #ff0033;
        }
        .instruction {
            margin-top: 25px;
            font-size: 0.95rem;
            color: #ffea9f;
            background: rgba(0, 0, 0, 0.45);
            padding: 8px 16px;
            border-radius: 20px;
            display: inline-block;
            border: 1px solid rgba(255, 215, 0, 0.3);
            animation: float 2s ease-in-out infinite alternate;
        }
        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.85; }
            100% { transform: scale(1.15); opacity: 1; }
        }
        @keyframes float {
            0% { transform: translateY(0); }
            100% { transform: translateY(-8px); }
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <div class="content">
        <div class="diya">🪔 ✨ 🪔</div>
        <h1>Happy Diwali</h1>
        <h2>With Best Wishes From <br><span class="name">Golu Singh</span></h2>
        <div class="instruction">🎆 Screen par kahin bhi tap karein patakhe phodne ke liye!</div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        let audioCtx = null;
        function playCrackSound() {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(140, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            } catch (e) {}
        }

        const colors = [
            '#ff0040', '#ff00aa', '#aa00ff', '#0040ff',
            '#00d4ff', '#00ff66', '#ffff00', '#ff8800', '#ffffff'
        ];

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 6 + 1.5;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.alpha = 1;
                this.decay = Math.random() * 0.02 + 0.015;
                this.gravity = 0.08;
            }
            update() {
                this.vx *= 0.98;
                this.vy *= 0.98;
                this.vy += this.gravity;
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= this.decay;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.fillStyle = this.color;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 2.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        let particles = [];

        function createBurst(x, y) {
            playCrackSound();
            const color = colors[Math.floor(Math.random() * colors.length)];
            const count = 45;
            for (let i = 0; i < count; i++) {
                particles.push(new Particle(x, y, color));
            }
        }

        function animate() {
            ctx.fillStyle = 'rgba(3, 3, 12, 0.22)';
            ctx.fillRect(0, 0, width, height);

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.update();
                p.draw();
                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                }
            }
            requestAnimationFrame(animate);
        }
        animate();

        window.addEventListener('pointerdown', (e) => {
            createBurst(e.clientX, e.clientY);
        });

        setInterval(() => {
            const rx = Math.random() * (width * 0.8) + (width * 0.1);
            const ry = Math.random() * (height * 0.5) + (height * 0.1);
            createBurst(rx, ry);
        }, 1200);
    </script>
</body>
</html>
